spring:
  application:
    name: platon-microservice-products
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/products_db}
    username: ${DB_USERNAME:products_user}
    password: ${DB_PASSWORD:products_pass}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: never
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
server:
  port: ${SERVER_PORT:8081}

security:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123}
  user:
    username: ${USER_USERNAME:student}
    password: ${USER_PASSWORD:student123}
