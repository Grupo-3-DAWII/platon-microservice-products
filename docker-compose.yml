services:
  db:
    image: postgres:16-alpine
    container_name: platon-products-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - products_postgres_data:/var/lib/postgresql/data
      - ../DATABASE/init/01-create-products-schema.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
      #- ../DATABASE/init/05-products-stock-deduction.sql:/docker-entrypoint-initdb.d/005-purchase-stock.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build:
      context: .
    container_name: platon-products-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      CONFIG_SERVER_URL: ${CONFIG_SERVER_URL:-http://host.docker.internal:8888}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      SERVER_PORT: 8081
      RABBITMQ_HOST: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_PORT}:8081"
volumes:
  products_postgres_data:
